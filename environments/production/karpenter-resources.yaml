---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  # Matches the node_iam_role_name from your eks.tf file
  role: "karpenter-node-role-eks-enterprise" 
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-enterprise"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-enterprise"
  tags:
    karpenter.sh/discovery: "eks-enterprise"

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"] 
  limits:
    cpu: "100"
    memory: 100Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
