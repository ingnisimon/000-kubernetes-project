apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-enterprise-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web-container
        image: 384518871764.dkr.ecr.us-east-1.amazonaws.com/eks-enterprise-app:05049fe2ca0b126b9e70775a8f1a31bd7ff2f871
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eks-enterprise-app-svc
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
